function SculptKernel() {

  restart() { for (const f of this.f) { f.reset(true); } this.round = 1; this.time = this.rules.roundTime; this.over = false; this.result = null; this.scores = []; this.rstat = [this.snap(0), this.snap(1)]; this.stop = 0; this.slow = 0; this.slowK = 1; this.state = 'idle'; this.resetPositions(); for (const f of this.f) if (f.ctrl.queue) { f.ctrl.queue.length = 0; f.ctrl.rest = 0; } }
  nextRound() { this.round++; this.time = this.rules.roundTime; for (const f of this.f) f.newRound(); this.resetPositions(); this.state = 'ready'; }
  finish(winner, how, extra = {}) { if (this.over) return; this.over = true; this.result = { winner, how, round: this.round, time: this.rules.roundTime - this.time, ...extra }; Bus.emit('matchEnd', { M: this, ...this.result }); }
  clock() { const t = Math.ceil(this.time); return Math.floor(t / 60) + ':' + String(t % 60).padStart(2, '0'); }
}

/* ── impact feel: what a landed strike does to time, camera, light, crowd ── */
const SWEAT = [0.86, 0.9, 0.95], DUST = [0.62, 0.58, 0.5];
Bus.on('strike', e => { if (e.m.heavy || e.m.sig) Vfx.trail(e.f, e.m.limb); else if (rand() < 0.5) Vfx.trail(e.f, e.m.limb); });
Bus.on('hit', e => {
  const M = Game.M; if (!M) return; const h = e.heavy, cinematic = Game.cine;
  if (e.clean) {
    M.hitstop(e.kd ? 0.17 : [0.045, 0.075, 0.115][h] * (e.counter ? 1.25 : 1)); Cam.kick(e.dir, [0.02, 0.045, 0.085][h] * (e.counter ? 1.3 : 1));
    Vfx.burst(e.pos, e.counter || e.combo ? 2 : 0, [0.5, 0.78, 1.1][h] * (e.kd ? 1.4 : 1)); Vfx.spray(e.pos, e.dir, 3 + h * 5 + Math.round(e.def.sweat * 6), SWEAT, 2.4 + h, 0.011);
    Gfx.fx.radial = Math.max(Gfx.fx.radial, [0, 0.01, 0.024][h] * (e.kd ? 1.8 : 1)); Gfx.fx.chroma = Math.max(Gfx.fx.chroma, [0, 0.0012, 0.003][h]); if (e.kd) Gfx.fx.flash = 0.16;
    Arena.cheer(e.kd ? 1 : [0.12, 0.3, 0.55][h] + (e.counter ? 0.15 : 0) + (e.combo ? 0.2 : 0), e.kd ? 3.5 : 0.8 + h * 0.5); if (h > 1 || e.kd) Arena.flashBurst(e.kd ? 1 : 0.4);
  } else if (e.perfect) { M.hitstop(0.09); Vfx.burst(e.pos, 1, 0.8); Cam.kick(e.dir, 0.02); Arena.cheer(0.3, 0.8); }
  else { M.hitstop(0.03 + h * 0.012); Vfx.burst(e.pos, 1, 0.42 + h * 0.14); Cam.kick(e.dir, 0.008 + h * 0.008); if (e.gbreak) { Arena.cheer(0.5, 1.2); Gfx.fx.chroma = 0.003; } }
});
Bus.on('evaded', e => { const M = Game.M; if (!M) return; if (e.f.idx === 0 || M.o.p1ai != null) M.slowmo(0.16, 0.45); Arena.cheer(0.22, 0.6); });
Bus.on('knockdown', e => { const M = Game.M; if (!M) return; M.slowmo(e.final ? 1.25 : 0.7, e.final ? 0.22 : 0.35); Arena.doWave(); e.f.rag && Vfx.spray(e.info.pos, e.info.dir, 14, SWEAT, 4, 0.013);
  if (e.final) { M.finish(e.att.idx, e.why, { ko: true }); } });
Bus.on('step', e => { if (e.h > 0.05 && e.f.vel.lengthSq() > 2) Vfx.spray(e.f.anim.feet[e.i].pos, UP, 2, DUST, 0.6, 0.02, 0.3); });

// ───────────────────────── 22_game.js ─────────────────────────
/* ═══════════════════════════ GAME (provisional harness) ═══════════════════════════ */
const Game = { M: null, cine: false, paused: false, last: 0, t: 0,
  startMatch(o) { if (this.M) this.M.dispose(); const M = this.M = new Match(o); Cam.mode = 'fight'; M.tick(1 / 60); Cam.snap(M); return M; },
  frame(now) { const dt = clamp((now - this.last) / 1000, 0.001, 1 / 20); this.last = now; this.step(dt, true); requestAnimationFrame(t => this.frame(t)); },
  step(dt, render) { Input.update(); const M = this.M; let h = dt; if (M && !this.paused) h = M.update(dt); Cam.update(dt, M); Arena.update(dt, Gfx.camera); Vfx.update(h, Gfx.camera); Gfx.tick(dt); if (render) Gfx.render(dt); this.t += dt; }
};
IA.Game = Game; IA.Bus = Bus; IA.Input = Input; IA.Cam = Cam; IA.MOVES = MOVES; IA.CLIPS = CLIPS;
await Promise.race([Promise.all(['italic 800 48px', '600 20px', '800 48px', '700 20px'].map(f => document.fonts.load(f + ' "Barlow Condensed"'))), new Promise(r => setTimeout(r, 2500))]).catch(() => {});
Gfx.init(); Cam.init(); Input.init(); IA.Gfx = Gfx; IA.Arena = Arena;
if (QS.has('view')) debugView();
else {
  Arena.build(); Vfx.init();
  const M = Game.startMatch({ a: fighterDef(QS.get('p1') || 'vale'), b: fighterDef(QS.get('p2') || 'koval'), level: +(QS.get('lvl') || 1), p1ai: QS.has('auto') ? +(QS.get('auto') || 1) : null, rules: { rounds: +(QS.get('rounds') || 3) } }); M.start();
  IA.dbg.step = (sec, dt = 1 / 60) => { for (let t = 0; t < sec; t += dt) Game.step(dt, false); };
  IA.dbg.state = () => { const M = Game.M; return { t: +M.simT.toFixed(2), state: M.state, round: M.round, time: +M.time.toFixed(1), over: M.over, result: M.result, scores: M.scores, f: M.f.map(f => ({ id: f.def.id, hp: +f.hp.toFixed(1), st: +f.st.toFixed(0), cap: +f.stCap.toFixed(0), state: f.state, daze: +f.daze.toFixed(0), guard: +f.guard.toFixed(0), cond: Object.fromEntries(Object.entries(f.cond).map(([k, v]) => [k, Math.round(v)])), pos: [+f.pos.x.toFixed(2), +f.pos.z.toFixed(2)], stats: f.stats, move: f.move && f.move.id })) }; };
  IA.dbg.render = () => Gfx.render(0);
  /** scripted exchange: fighter 1 throws `atk` at `dist`; fighter 0 answers with `def` after `delay` s. Returns the events seen. */
  IA.dbg.exchange = (atk, def, delay = 0, dist = 0.9, extra = {}) => { const M = Game.M; M.restart(); M.rules.noClock = true; M.state = 'fight'; const [a, b] = M.f; a.ctrl.passive = b.ctrl.passive = true; a.place(-dist / 2, 0, PI / 2); b.place(dist / 2, 0, -PI / 2);
    const ev = [], on = (n) => Bus.on(n, e => ev.push(n + (e.type ? ':' + e.type : '') + (e.perfect ? ':perfect' : '') + (e.clean ? ':clean' : '') + (e.counter ? ':counter' : '') + (e.kd ? ':kd' : '') + (e.dmg != null ? ':' + e.dmg.toFixed(1) : ''))), hs = ['hit', 'whiff', 'evaded', 'knockdown'].map(n => [n, on(n)]);
    for (let i = 0; i < 20; i++) Game.step(1 / 60, false); b.pressMove(atk); let t = 0, done = false; const hp0 = a.hp;
    while (t < 1.6) { if (!done && t >= delay) { done = true; if (def.startsWith('guard')) { a.ctrl.passiveGuard = def.slice(5) || 'mid'; } else if (def.startsWith('ev:')) a.pressEvade(def.slice(3)); else if (def.startsWith('atk:')) a.pressMove(def.slice(4)); }
      if (extra.then && t >= extra.thenAt && !extra.did) { extra.did = true; a.pressMove(extra.then); } Game.step(1 / 120, false); t += 1 / 120; }
    for (const [n, f] of hs) Bus.off(n, f); a.ctrl.passiveGuard = null; return { ev, dHp: +(hp0 - a.hp).toFixed(1), aState: a.state, bHp: +(b.k.hpMax - b.hp).toFixed(1), su: +b.k.time.toFixed(2) }; };
  /** run whole fights headless and report outcomes (balance testing) */
  IA.dbg.fights = (n, maxSec = 260) => { const out = []; for (let i = 0; i < n; i++) { const M = Game.M; M.restart(); M.start(); let t = 0;
      while (!M.over && t < maxSec) { Game.step(1 / 60, false); t += 1 / 60; if (M.state === 'roundEnd' && !M.over) { M.nextRound(); M.start(); } }
      const r = M.result || { winner: -2, how: 'timeout' }; out.push({ w: r.winner, how: r.how, rd: r.round, t: Math.round(t), kd: [M.f[0].stats.kd, M.f[1].stats.kd], land: [M.f[0].stats.landed, M.f[1].stats.landed], thr: [M.f[0].stats.thrown, M.f[1].stats.thrown], blk: [M.f[0].stats.blocked, M.f[1].stats.blocked], ev: [M.f[0].stats.evaded, M.f[1].stats.evaded], hp: [Math.round(M.f[0].hp), Math.round(M.f[1].hp)], sc: M.scores }); }
    return out; };
  IA.ready = true; Game.last = performance.now(); if (!QS.has('manual')) requestAnimationFrame(t => Game.frame(t));
}

// ───────────────────────── 23_debug.js ─────────────────────────
/* ═══════════════════════════ DEBUG VIEWS (?view=model|clip|arena) ═══════════════════════════ */
function debugView() {
  const def = ROSTER.find(r => r.id === (QS.get('f') || 'vale')) || ROSTER[0];
  const t0 = performance.now(); const fm = new FighterModel(def); IA.fm = fm; IA.buildMs = performance.now() - t0;
  Gfx.scene.add(fm.group);
  const an = IA.an = new Animator(fm, def.style);
  const floor = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.ShadowMaterial({ opacity: 0.5 })); floor.rotation.x = -PI / 2; floor.receiveShadow = true; Gfx.scene.add(floor);
  const bg = new THREE.Mesh(new THREE.CircleGeometry(6, 48), new THREE.MeshBasicMaterial({ color: 0x3a3c42 })); bg.rotation.x = -PI / 2; bg.position.y = -0.002; Gfx.scene.add(bg);
  const dummy = new THREE.Group(); const dm = new THREE.MeshBasicMaterial({ color: 0x6a7388, transparent: true, opacity: 0.45 });
  const dh = new THREE.Mesh(new THREE.SphereGeometry(0.105, 16, 12), dm), dbody = new THREE.Mesh(new THREE.CapsuleGeometry(0.15, 0.42, 6, 12), dm), dl = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.7, 6, 12), dm);
  dummy.add(dh, dbody, dl); dummy.visible = false; Gfx.scene.add(dummy);
  Gfx.renderer.setClearColor(0x24262b, 1);
  const cell = (cv, c, i, cols, cw, ch, v) => { Gfx.camera.fov = v.fov || 30; Gfx.camera.aspect = cw / ch; Gfx.camera.updateProjectionMatrix(); Gfx.camera.position.set(...v.pos); Gfx.camera.lookAt(...v.at);
    Gfx.render(0); c.drawImage(Gfx.renderer.domElement, (i % cols) * cw, Math.floor(i / cols) * ch, cw, ch); };
  const sheetCv = (w, h) => { let cv = document.getElementById('sheet'); if (!cv) { cv = document.createElement('canvas'); cv.id = 'sheet'; cv.style.cssText = 'position:fixed;left:0;top:0;z-index:50'; document.body.appendChild(cv); } cv.width = w; cv.height = h; return cv; };
  IA.dbg.sheet = (views, cols, cw, ch, posed) => {
    const cv = sheetCv(cols * cw, Math.ceil(views.length / cols) * ch), c = cv.getContext('2d');
    if (posed) for (let i = 0; i < 60; i++) an.update(1 / 60);
    views.forEach((v, i) => { if (posed) { an.yaw = v.rot || 0; an.placeFeet(); an.update(0.001); } else fm.group.rotation.y = v.rot || 0; cell(cv, c, i, cols, cw, ch, v); });
  };
  /** filmstrip of a clip at the given phase times */
  IA.dbg.film = (name, tps, o = {}) => {
    const D = o.dist || 0.98, s = fm.sk.s, tgt = { head: [0, 1.6 * s, D], body: [0, 1.14 * s, D], leg: [0.1, 0.52 * s, D - 0.05], calf: [0.1, 0.3 * s, D - 0.05] }[o.aim || 'head'];
    dummy.visible = true; dh.position.set(0, 1.6 * s, D + 0.1); dbody.position.set(0, 1.15 * s, D + 0.14); dl.position.set(0.1, 0.45 * s, D + 0.02);
    an.root.set(0, 0, 0); an.yaw = 0; an.vel.set(0, 0, 0); an.stop(0); an.placeFeet(); an.resetSprings();
    for (const k of ['lh', 'rh', 'lf', 'rf']) an.aimW[k].set(...tgt); an.aimW.look.set(0, 1.6 * s, D);
    for (let i = 0; i < 90; i++) an.update(1 / 60);
    const views = o.views || [{ pos: [-4.6, 1.25, 0.4], at: [0, 1.0, 0.4], fov: 26 }], cw = o.cw || 250, ch = o.ch || 400;
    const cv = sheetCv(tps.length * cw, views.length * ch), c = cv.getContext('2d'); let started = false;
    tps.forEach((tp, i) => {
      if (tp >= 0 && !started) { an.play(name, { phases: o.phases || [0.2, 0.08, 0.3], dur: o.dur }); started = true; }
      let guard = 0; while (started && an.layer.clip && an.layer.tp < tp && guard++ < 2000) an.update(1 / 240);
      if (!an.layer.clip && started) for (let k = 0; k < 30; k++) an.update(1 / 60);
      an.update(1e-5);
      views.forEach((v, j) => cell(cv, c, i + j * tps.length, tps.length, cw, ch, v));
    });
  };
  if (QS.get('view') === 'arena') {
    floor.visible = bg.visible = false; Gfx.renderer.setClearColor(0x050506, 1); Arena.build();
    const fm2 = new FighterModel({ ...def, id: 'b' }); Gfx.scene.add(fm2.group); const an2 = IA.an2 = new Animator(fm2, def.style);
    an.root.set(-0.75, 0, 0); an.yaw = PI / 2; an.placeFeet(); an2.root.set(0.75, 0, 0); an2.yaw = -PI / 2; an2.placeFeet();
    an.aimW.look.set(0.75, 1.6, 0); an2.aimW.look.set(-0.75, 1.6, 0);
    IA.dbg.arena = (pos, at, fov, t = 1, mood) => { if (mood) Arena.setMood(mood, true); Gfx.camera.fov = fov || 36; Gfx.camera.aspect = innerWidth / innerHeight; Gfx.camera.updateProjectionMatrix(); Gfx.camera.position.set(...pos); Gfx.camera.lookAt(...at);
      for (let i = 0; i < Math.round(t * 60); i++) { an.update(1 / 60); an2.update(1 / 60); Arena.update(1 / 60, Gfx.camera); Gfx.L.uTime.value += 1 / 60; }
      for (let i = 0; i < 2; i++) { const a = i ? an2 : an; a.pt('ballL', _v1); Arena.blob(i * 2, _v1.x, _v1.z, 0.16, 0.5); a.pt('ballR', _v1); Arena.blob(i * 2 + 1, _v1.x, _v1.z, 0.16, 0.5); }
      Gfx.render(0); return Gfx.stats; };
  }
  IA.ready = true;
}
